    if(F.m)cm[i]=d[F.cmF]/d.Mero*micM; if(F.c)cc[i]=d[F.ccF]*cscale; if(F.s)ca[i]=d[F.caF];}
  return{cm,cc,ca,neff:1/sw2};
}
function inRange(micM,micC,micA){return micM>=32&&micM<=128&&micC>=0.0625&&micC<=0.25&&micA>=32&&micA<=128;}
function quantile(sorted,q){const k=(sorted.length-1)*q,f=Math.floor(k),c=Math.ceil(k);return sorted[f]+(sorted[c]-sorted[f])*(k-f);}
function bandSeries(ser,n,ratio){const out=[];const buf=new Float32Array(n);
  for(let t=0;t<NWIN;t+=2){for(let i=0;i<n;i++)buf[i]=ser[i*NWIN+t]*ratio[i];const s=Float32Array.from(buf).sort();out.push([t*DT,quantile(s,0.05),quantile(s,0.5),quantile(s,0.95)]);}
  return out;}

function computeAll(inp){
  const f=FORMS[inp.form||'T'];
  const cScale=inp.cScale||1,target=inp.target||0.9,limM=inp.limM!=null?inp.limM:0.2,limC=inp.limC!=null?inp.limC:0.3;
  const n=inp.n,P=makePatients(n,inp.crcl,inp.crclCv/100,inp.weight,20261112,inp.age||65,null,{height:inp.height||165,sex:inp.sex});
  if(inp.sulElfR&&inp.sulElfR!==0.5){const k=inp.sulElfR/0.5;for(let i=0;i<n;i++)P.rS_elf[i]*=k;}
  const rng=makeRng(777),ones=new Uint8Array(n).fill(1);
  let cmA=null,ccA=null,caA=null,neff=null;
  if(inp.mode==='manual'){if(f.m)cmA=new Float64Array(n).fill(inp.cmManual);if(f.c)ccA=new Float64Array(n).fill(inp.ccManual);if(f.s)caA=new Float64Array(n).fill(inp.caManual||8);}
  else{const s=sampleComb(f.id,inp.micM,inp.micC,inp.micA,n,rng);cmA=s.cm;ccA=s.cc;caA=s.ca;neff=s.neff;}
  const ccT=f.c?Float64Array.from(ccA,v=>v*inp.mult):null, csT=f.s?Float64Array.from(caA,v=>v/2):null;
  const site=inp.site,o={fu:inp.fuCol,rElf:inp.colElfR};
  const rM=ratioM(P,site),rS=ratioS(P,site,inp.sulCsf);
  const mSer={},mReg={},mTox={},okM={},sSer={},sReg={},okS={},cssK={},cTox={},okC={};
  for(const id of MERO_IDS){const reg=meroReg(id,inp.crcl);mReg[id]=reg;mSer[id]=simulate(n,P.m_k10,P.m_k12,P.m_k21,P.m_V1,reg);mTox[id]=mean(minOf(mSer[id],n).map(v=>v>=45?1:0),n);okM[id]=f.m?okTime(mSer[id],n,rM,cmA,inp.tgtM):ones;}
  for(const id of SUL_IDS){const reg=sulReg(id,inp.crcl);sReg[id]=reg;sSer[id]=simulate(n,P.s_k10,P.s_k12,P.s_k21,P.s_V1,reg);okS[id]=f.s?okTime(sSer[id],n,rS,csT,sulTarget(site)):ones;}
  for(const mu of CMS){const css=cssArr(P,mu,inp.crcl);if(cScale!==1){for(let i=0;i<css.length;i++)css[i]*=cScale;}cssK[mu]=css;let k=0;for(let i=0;i<n;i++)if(css[i]>=4)k++;cTox[mu]=k/n;okC[mu]=f.c?okCol(css,site,ccT,o):ones;}
  const a=okM[inp.mId],b=okS[inp.sId],c=okC[inp.kMU];let J=0;for(let i=0;i<n;i++)J+=a[i]&b[i]&c[i];J/=n;
  const jci=wilson(Math.round(J*n),n);
  const sel={joint:J,jlo:jci[0],jhi:jci[1],pM:f.m?mean(a,n):null,pS:f.s?mean(b,n):null,pC:f.c?mean(c,n):null,toxM:f.m?mTox[inp.mId]:0,toxC:f.c?cTox[inp.kMU]:0,medCss:(()=>{const s=Float64Array.from(cssK[inp.kMU]).sort();return quantile(s,0.5);})()};
  const combos=[];
  for(const mid of (f.m?MERO_IDS:[null]))for(const sid of (f.s?SUL_IDS:[null]))for(const mu of (f.c?CMS:[null])){
    const x=mid?okM[mid]:ones,y=sid?okS[sid]:ones,z=mu!==null?okC[mu]:ones;let j=0;for(let i=0;i<n;i++)j+=x[i]&y[i]&z[i];j/=n;
    const tm=mid?mTox[mid]:0,tc=mu!==null?cTox[mu]:0;
    combos.push({mid,sid,mu,joint:j,cost:(mid?MERO[mid].gd/6:0)+(sid?SUL[sid].gd/9:0)+(mu!==null?cmsEff(mu,inp.crcl)/9:0),toxM:tm,toxC:tc,safe:(tm<=limM&&tc<limC)});}
  const safeOk=combos.filter(x=>x.safe&&x.joint>=target).sort((p,q)=>p.cost-q.cost||q.joint-p.joint);
  const bestAny=combos.filter(x=>x.safe).sort((p,q)=>q.joint-p.joint||p.cost-q.cost);
  const top5=bestAny.slice(0,5);
  const nS=Math.min(n,600),MM=[16,32,64,128,256],CC=[0.0625,0.125,0.25,0.5,1],AA=[32,64,128,256];
  const ax=f.id==='T'?{r:'M',c:'C',t:'A'}:f.id==='CM'?{r:'M',c:'C',t:null}:f.id==='CS'?{r:'A',c:'C',t:null}:{r:'M',c:'A',t:null};
  const vals={M:MM,C:CC,A:AA},names={M:'Meropenem MIC',C:'Colistin MIC',A:'Ampicillin MIC'};
  const tabs=ax.t?vals[ax.t]:[0];const scan={};
  const serM=mSer[inp.mId],serS=sSer[inp.sId];
  for(const T of tabs){scan[T]=[];for(const R of vals[ax.r]){const row=[];for(const Cc of vals[ax.c]){
    const mic={M:inp.micM,C:inp.micC,A:inp.micA};mic[ax.r]=R;mic[ax.c]=Cc;if(ax.t)mic[ax.t]=T;
    let cmv=null,ccv=null,csv=null;
    if(inp.mode==='manual'){if(f.m)cmv=new Float64Array(nS).fill(inp.cmManual);if(f.c)ccv=new Float64Array(nS).fill(inp.ccManual*inp.mult);if(f.s)csv=new Float64Array(nS).fill((inp.caManual||8)/2);}
    else{const s=sampleComb(f.id,mic.M,mic.C,mic.A,nS,makeRng(1000+Math.round(mic.M*7)+Math.round(mic.C*1000)+mic.A));if(f.m)cmv=s.cm;if(f.c)ccv=Float64Array.from(s.cc,v=>v*inp.mult);if(f.s)csv=Float64Array.from(s.ca,v=>v/2);}
    const om=f.m?okTime(serM,nS,rM,cmv,inp.tgtM):null,os=f.s?okTime(serS,nS,rS,csv,sulTarget(site)):null,oc=f.c?okCol(cssK[inp.kMU].subarray(0,nS),site,ccv,o):null;
    let j=0;for(let i=0;i<nS;i++)j+=(om?om[i]:1)&(os?os[i]:1)&(oc?oc[i]:1);
    const ex=(f.m&&(mic.M<32||mic.M>128))||(f.c&&(mic.C<0.0625||mic.C>0.25))||(f.s&&(mic.A<32||mic.A>128));
    row.push({j:j/nS,ex});}scan[T].push(row);}}
  const map={rows:vals[ax.r],cols:vals[ax.c],tabs:ax.t?tabs:null,rowName:names[ax.r],colName:names[ax.c],tabName:ax.t?names[ax.t]:null,scan,ax};
  const cmp=[],cacheM=new Map(),cacheS=new Map(),cacheC=new Map();
  const gM=t=>{let v=cacheM.get(t);if(!v){v=okTime(mSer[inp.mId],n,rM,t,inp.tgtM);cacheM.set(t,v);}return v;};
  const gS=t=>{let v=cacheS.get(t);if(!v){v=okTime(sSer[inp.sId],n,rS,t,sulTarget(site));cacheS.set(t,v);}return v;};
  const gC=t=>{let v=cacheC.get(t);if(!v){v=okCol(cssK[inp.kMU],site,t,o);cacheC.set(t,v);}return v;};
  for(const fid of FORM_IDS){const F=FORMS[fid];let sum=0,n90=0,sm=0,ss=0,sc=0;
    for(let j=0;j<DATA.length;j++){const d=DATA[j];
      const x=F.m?gM(d[F.cmF]):ones,y=F.s?gS(d[F.caF]/2):ones,z=F.c?gC(d[F.ccF]*inp.mult):ones;let t=0,tm=0,ts=0,tc=0;
      for(let i=0;i<n;i++){t+=x[i]&y[i]&z[i];tm+=x[i];ts+=y[i];tc+=z[i];}
      const p=t/n;sum+=p;if(p>=target)n90++;sm+=tm/n;ss+=ts/n;sc+=tc/n;}
    const N=DATA.length;cmp.push({id:fid,name:F.short,cfr:sum/N,p90:n90/N,pM:F.m?sm/N:null,pS:F.s?ss/N:null,pC:F.c?sc/N:null,syn:SYN[fid]});}
  const chart={mero:f.m?bandSeries(mSer[inp.mId],n,rM):null,sul:f.s?bandSeries(sSer[inp.sId],n,rS):null};
  const med=arr=>{const s=Float64Array.from(arr).sort();return quantile(s,0.5);};
  const cmS=f.m?Float64Array.from(cmA).sort():null;
  return{form:f.id,F:f,cScale,target,limM,limC,colVals:f.c?colEff(cssK[inp.kMU],site,o):null,P,sel,combos,safeOk,bestAny,top5,map,cmp,chart,
    cm:f.m?{p10:quantile(cmS,0.1),p50:quantile(cmS,0.5),p90:quantile(cmS,0.9)}:null,cc:f.c?med(ccT):null,cs:f.s?med(csT):null,neff,
    regM:f.m?mReg[inp.mId]:null,regS:f.s?sReg[inp.sId]:null,effMU:f.c?cmsEff(inp.kMU,inp.crcl):null,
    inRange:inp.mode==='manual'?true:!((f.m&&(inp.micM<32||inp.micM>128))||(f.c&&(inp.micC<0.0625||inp.micC>0.25))||(f.s&&(inp.micA<32||inp.micA>128))),inp};
}

const pct=x=>Math.round(x*100)+'%';
const fmt=x=>x>=10?x.toFixed(0):x>=1?x.toFixed(1):x>=0.1?x.toFixed(2):x.toFixed(3);
function cls(p){return p>=TGT?'ok':p>=TGT-0.2?'warn':'bad';}
function clampN(v,lo,hi,d){if(v===''||v==null)return d;v=Number(v);return(v===v&&isFinite(v))?Math.min(hi,Math.max(lo,v)):d;}
function cmsText(mu,crcl){return mu===0?'algorithm dose ('+cmsEff(0,crcl).toFixed(1)+' MU/day)':mu+' MU/day';}
function clean(i){const o={...i};o.age=clampN(i.age,18,100,70);o.height=clampN(i.height,120,220,165);o.crcl=clampN(i.crcl,5,250,70);o.weight=clampN(i.weight,30,200,71);o.crclCv=clampN(i.crclCv,0,50,15);return o;}
function problems(i){const p=[];const chk=(k,lo,hi,name)=>{const v=i[k];if(v===''||!(Number(v)>=lo&&Number(v)<=hi))p.push(name+' must be between '+lo+' and '+hi+'; the simulation uses '+clean(i)[k]+'.');};chk('crcl',5,250,'CrCl');chk('weight',30,200,'Weight');chk('crclCv',0,50,'CrCl uncertainty');return p;}
function renalCat(c){return c>=130?['Augmented renal clearance','warn']:c>=90?['Normal range','ok']:c>=60?['Mildly reduced','ok']:c>=30?['Moderately reduced','warn']:c>=15?['Severely reduced','bad']:['Kidney failure range','bad'];}
function verdictOf(s,i){const t=(i&&i.target)||0.9,lm=i&&i.limM!=null?i.limM:0.2,lc=i&&i.limC!=null?i.limC:0.3;
  if(s.joint>=t&&s.toxM<=lm&&s.toxC<lc)return['ok','Target met and within safety limits','Joint probability of attainment '+pct(s.joint)+' (target '+pct(t)+')'];
  if(s.joint>=t)return['warn','Target met, but toxicity risk exceeds the limits','Joint probability of attainment '+pct(s.joint)+' (target '+pct(t)+')'];
  if(s.joint>=t-0.2)return['warn','Borderline: attainment between '+pct(t-0.2)+' and '+pct(t),'Joint probability of attainment '+pct(s.joint)];
  return['bad','Target not met','Joint probability of attainment '+pct(s.joint)+' (target '+pct(t)+')'];}

function niceTicks(max){const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,st=(m<=1?1:m<=2?2:m<=5?5:10)*p;const t=[];for(let v=0;v<=max*1.001;v+=st)t.push(v);return t;}

function ProfilePlot(p){
  const data=p.data,W=660,H=p.showX?(p.h||190)+34:(p.h||190),L=54,R=14,T=22,B=p.showX?44:10;
  const log=p.yscale==='log';
  const q95=Math.max(...data.map(d=>d[3]));
  const lo=Math.log10(0.05),hi=Math.log10(Math.max(100,q95));
  const lmax=Math.max(q95,(p.thr||0)*1.5)*1.08;
  const x=t=>L+(W-L-R)*t/24;
  const y=v=>log?T+(H-T-B)*(1-(Math.log10(Math.max(v,0.05))-lo)/(hi-lo)):T+(H-T-B)*(1-Math.min(v,lmax)/lmax);
  const line=(k)=>data.map((d,i)=>(i?'L':'M')+x(d[0]).toFixed(1)+','+y(d[k]).toFixed(1)).join(' ');
  const band=line(3)+' '+data.slice().reverse().map(d=>'L'+x(d[0]).toFixed(1)+','+y(d[1]).toFixed(1)).join(' ')+' Z';
  const ticks=log?[0.1,1,10,100].filter(v=>Math.log10(v)<=hi):niceTicks(lmax);
  const move=e=>{const r=e.currentTarget.getBoundingClientRect();if(!r.width)return;const px=(e.clientX-r.left)/r.width*W;const t=Math.max(0,Math.min(24,(px-L)/(W-L-R)*24));p.setHover(t);};
  const hi_=p.hover!=null?data.reduce((b,d,i)=>Math.abs(d[0]-p.hover)<Math.abs(data[b][0]-p.hover)?i:b,0):null;
  const hd=hi_!=null?data[hi_]:null;
  const tx=hd?Math.min(x(hd[0])+8,W-190):0;
  return html`<svg viewBox=${'0 0 '+W+' '+H} width="100%" role="img" aria-label=${p.title} onMouseMove=${move} onMouseLeave=${()=>p.setHover(null)}>
    ${ticks.map(v=>html`<g key=${'y'+v}><line x1=${L} x2=${W-R} y1=${y(v)} y2=${y(v)} style=${{stroke:'var(--grid)'}}></line><text x=${L-6} y=${y(v)+4} textAnchor="end">${String(+v.toPrecision(3))}</text></g>`)}
    ${p.showX?[0,4,8,12,16,20,24].map(t=>html`<text key=${'x'+t} x=${x(t)} y=${H-B+16} textAnchor="middle">${String(t)}</text>`):null}
    ${p.showX?html`<text x=${(L+W-R)/2} y=${H-6} textAnchor="middle" style=${{fontSize:'11px'}}>Time within the 24-h dosing window at steady state (h)</text>`:null}
    ${p.thrBand?html`<rect x=${L} width=${W-L-R} y=${y(p.thrBand[1])} height=${Math.max(1,y(p.thrBand[0])-y(p.thrBand[1]))} style=${{fill:'var(--thr)',opacity:.12}}></rect>`:null}
    ${p.showBand?html`<path d=${band} style=${{fill:p.color,opacity:.18}}></path>`:null}
    <path d=${line(2)} style=${{fill:'none',stroke:p.color,strokeWidth:2.2}}></path>
    ${p.thr!=null?html`<g><line x1=${L} x2=${W-R} y1=${y(p.thr)} y2=${y(p.thr)} style=${{stroke:'var(--thr)',strokeDasharray:'6 4',strokeWidth:1.4}}></line><text x=${W-R-3} y=${y(p.thr)-4} textAnchor="end" style=${{fill:'var(--thr)'}}>${p.thrLabel}</text></g>`:null}
    <text x=${L} y=${13} style=${{fill:p.color,fontWeight:700,fontSize:'12px'}}>${p.title}</text>
    <text x=${W-R} y=${13} textAnchor="end">${p.unit+(log?' (log scale)':'')+' · line: median · shaded: 5th–95th percentile'}</text>
    ${hd?html`<g><line x1=${x(hd[0])} x2=${x(hd[0])} y1=${T} y2=${H-B} style=${{stroke:'var(--muted)',strokeWidth:1}}></line><circle cx=${x(hd[0])} cy=${y(hd[2])} r="3.5" style=${{fill:p.color}}></circle>
      <g><rect x=${tx} y=${T+2} width="182" height="40" rx="4" style=${{fill:'var(--panel)',stroke:'var(--border)'}}></rect>
      <text x=${tx+7} y=${T+16} style=${{fill:'var(--text)'}}>${'t = '+hd[0].toFixed(1)+' h'}</text>
      <text x=${tx+7} y=${T+30} style=${{fill:'var(--text)'}}>${'median '+fmt(hd[2])+' ('+fmt(hd[1])+'–'+fmt(hd[3])+')'}</text></g></g>`:null}
  </svg>`;}

function Histo(p){
  const v=Array.from(p.vals).filter(a=>a>0).map(a=>Math.log10(a));
  const W=660,H=190,L=54,R=14,T=22,B=44;
  const lo=Math.min(-2.5,Math.min(...v)),hi=Math.max(0.7,Math.max(...v)),nb=28,bw=(hi-lo)/nb;
  const bins=new Array(nb).fill(0);v.forEach(a=>{let k=Math.floor((a-lo)/bw);if(k>=nb)k=nb-1;if(k<0)k=0;bins[k]++;});
  const mx=Math.max(...bins),x=a=>L+(W-L-R)*(a-lo)/(hi-lo),y=c=>T+(H-T-B)*(1-c/mx);
  const lt=Math.log10(p.thr);const above=p.vals.filter?0:0;
  let ab=0;for(const a of p.vals)if(a>=p.thr)ab++;
  const ticks=[0.01,0.1,1,10].filter(t=>Math.log10(t)>=lo&&Math.log10(t)<=hi);
  return html`<svg viewBox=${'0 0 '+W+' '+H} width="100%" role="img" aria-label=${p.title}>
    ${ticks.map(t=>html`<g key=${t}><line x1=${x(Math.log10(t))} x2=${x(Math.log10(t))} y1=${T} y2=${H-B} style=${{stroke:'var(--grid)'}}></line><text x=${x(Math.log10(t))} y=${H-B+16} textAnchor="middle">${String(t)}</text></g>`)}
    ${bins.map((c,i)=>html`<rect key=${i} x=${x(lo+i*bw)+1} y=${y(c)} width=${Math.max(1,(W-L-R)/nb-2)} height=${H-B-y(c)} style=${{fill:(lo+(i+0.5)*bw)>=lt?'var(--ok)':'var(--bad)',opacity:.75}}></rect>`)}
    <line x1=${x(lt)} x2=${x(lt)} y1=${T} y2=${H-B} style=${{stroke:'var(--thr)',strokeDasharray:'6 4',strokeWidth:1.6}}></line>
    <text x=${x(lt)+4} y=${T+10} style=${{fill:'var(--thr)'}}>${'threshold '+fmt(p.thr)+' mg/L'}</text>
    <text x=${L} y=${13} style=${{fill:'var(--cCol)',fontWeight:700,fontSize:'12px'}}>${p.title}</text>
    <text x=${W-R} y=${13} textAnchor="end">${'virtual patients above threshold: '+Math.round(100*ab/p.vals.length)+'%'}</text>
    <text x=${(L+W-R)/2} y=${H-6} textAnchor="middle">${p.xlabel}</text></svg>`;}

function ProfilesTab(p){const res=p.res,f=res.F;const [hover,setHover]=useState(null);const [yscale,setYs]=useState('log');const [band,setBand]=useState(true);

function MapTab(p){const res=p.res,tab=p.tab,setTab=p.setTab,m=res.map,inp=res.inp;const lc=s=>s.replace(' MIC','').toLowerCase()+' MIC';
  const key=l=>({M:'micM',C:'micC',A:'micA'}[l]);

    summary=html`<div className="note"><b>${'Highest '+lc(m.rowName)+' still attaining '+pct(res.target)+(m.tabs?' ('+lc(m.tabName)+' '+tk+')':'')+': '}</b>${parts.join(' · ')}</div>`;}

function runValidation(cScale,sulElfR){
  const N=1500,rows=[],pc=x=>Math.round(x*100);
  const cmp=(v,pub,tol)=>Math.abs(pc(v)-pub)<=tol?'ok':(pc(v)>pub?'optimistic':'pessimistic');
  {const p=makePatients(N,170,0.25,58,99,70),ser=simulate(N,p.m_k10,p.m_k12,p.m_k21,p.m_V1,[2000,8,3]);const v=mean(okTime(ser,N,ratioM(p,'plasma'),2,1.0),N);
   rows.push(['Meropenem 2 g q8h, 3-h infusion, CrCl about 170 (augmented clearance), 58 kg: 100% fT>c at c = 2 µg/mL','At least 90% (Luo 2025, PMID 40417688; full text read)',pc(v)+'%',v>=0.9?'ok':v>=0.82?'close':'pessimistic']);}
  {const mkr=(lo,hi,seed)=>{const p=makePatients(N,0,0,75,seed,null,null,{range:[lo,hi]});p.fu=new Float64Array(N);const r=makeRng(seed+1);for(let i=0;i<N;i++)p.fu[i]=0.85+0.13*r.u();return p;};
   const g=(p,reg,mic)=>{const sr=simulate(N,p.m_k10,p.m_k12,p.m_k21,p.m_V1,reg);return mean(okTime(sr,N,p.fu,mic,0.4),N);};
   const cr=(lab,lo,hi,reg,mic,pub,seed)=>{const v=g(mkr(lo,hi,seed),reg,mic);rows.push([lab,pub+'% (Crandon 2011, PMID 21136037; full text read)',pc(v)+'%',cmp(v,pub,6)]);};
   cr('Meropenem 2 g q8h (3-h infusion), CrCl 50 to 120, 40% fT>MIC, MIC 16',50,120,[2000,8,3],16,73.0,11);
   cr('Meropenem 2 g q8h (0.5-h infusion), CrCl 50 to 120, MIC 8',50,120,[2000,8,0.5],8,74.8,12);
   cr('Meropenem 1 g q8h (0.5-h infusion), CrCl 30 to 49, MIC 8',30,49,[1000,8,0.5],8,65.4,13);
   cr('Meropenem 1 g q12h (0.5-h infusion), CrCl 10 to 29, MIC 4',10,29,[1000,12,0.5],4,84.0,14);}
  {const p=makePatients(N,70,0.6,59.6,99,null,0.3),f=(reg,mic)=>{const s=simulate(N,p.s_k10,p.s_k12,p.s_k21,p.s_V1,reg);return mean(okTime(s,N,ratioS(p,'plasma',0.5),mic,0.6),N);};

function HelpBody(){return html`<div>
  <p><b>What this tool answers.</b> For each combination formula (the triple combination of colistin, meropenem and ampicillin/sulbactam, or one of the three pairs): (1) where the concentrations needed in the combination fall for an isolate with given baseline MICs; (2) whether a dosing regimen can reach those concentrations at the infection site with acceptable safety.</p>
  <p><b>How to use.</b> Pick the formula, enter the isolate MICs (or measured checkerboard concentrations), the patient's renal function, the infection site and the regimens. Only the drugs of the chosen formula are simulated. The result updates automatically. The Compare formulas tab shows all four formulas side by side for the same patient and regimens; the MIC attainment map shows which baseline MICs the current regimen can cover; the Dose finder lists the lightest regimen that reaches the target; the Model validation tab compares the engine with published figures. Your inputs and pinned runs are kept in this browser between visits.</p>
  <p><b>How to read the result.</b> Attainment is the share of virtual patients in whom every drug of the formula reaches its target at the same time. Targets: meropenem at least 40% of the interval above its combination concentration; sulbactam at least 60% of the interval above its combination concentration (half the ampicillin value; 47.5% in lung); colistin free concentration above its combination concentration. In the Compare tab each of the 39 measured isolates uses its own concentrations.</p>
  <p><b>Synergy.</b> Synergy rates use FICI of 0.5 or less, no interaction above 0.5 up to 4, antagonism above 4. For the triple combination a less strict criterion (FIC below 0.8) was used in the earlier paper and is shown for comparison.</p>
  <p><b>Glossary.</b> MIC: minimum inhibitory concentration of a drug alone. FIC: fractional inhibitory concentration. fT>c: fraction of the dosing interval that the free concentration stays above the target concentration c. ELF: epithelial lining fluid of the lung. CrCl: creatinine clearance (Cockcroft-Gault). CMS: colistimethate sodium, the prodrug of colistin; 1 MU is about 33 mg of colistin base activity. Css: average steady-state colistin concentration. Polysorbate 80: a surfactant that can make polymyxin MICs read 4 to 8 times lower than the true value.</p>
  <p><b>Limits.</b> The targets are per-drug, not validated for any combination. Combination concentrations come from static checkerboards, so the results describe attainment of concentrations linked to in vitro inhibition, not clinical efficacy; reaching a pair's concentrations does not mean the pair is synergistic. This is a research tool and must not be used to choose doses for individual patients.</p></div>`;}
function exportText(res){const s=res.sel,i=res.inp,f=res.F,m=res.map;
  const L=[['Formula',f.name],['Site',i.site],['CrCl (mL/min)',i.crcl],['Weight (kg)',i.weight],['Mode',i.mode],['MIC meropenem / colistin / ampicillin',i.micM+' / '+i.micC+' / '+i.micA]];
  if(f.m)L.push(['Meropenem regimen',regText(res.regM)],['Combination meropenem median (P10-P90)',fmt(res.cm.p50)+' ('+fmt(res.cm.p10)+'-'+fmt(res.cm.p90)+')']);
  if(f.s)L.push(['Sulbactam regimen',regText(res.regS)],['Sulbactam target (ug/mL)',fmt(res.cs)]);
  if(f.c)L.push(['CMS',cmsText(i.kMU,i.crcl)],['Combination colistin threshold',fmt(res.cc)]);
  L.push(['Joint attainment',pct(s.joint)+' (95% CI '+pct(s.jlo)+'-'+pct(s.jhi)+')']);
  if(f.m)L.push(['Meropenem attainment',pct(s.pM)],['Meropenem trough >=45 mg/L',pct(s.toxM)]);
  if(f.s)L.push(['Sulbactam attainment',pct(s.pS)]);
  if(f.c)L.push(['Colistin attainment',pct(s.pC)],['Colistin Css >=4 mg/L',pct(s.toxC)]);
  let t=L.map(r=>r.join('\t')).join('\n')+'\n\nFormula comparison (39 measured isolates)\tvirtual patients attaining\tisolates at target\tsynergy\n'+res.cmp.map(r=>[r.name,pct(r.cfr),pct(r.p90),r.syn[0]+'/'+r.syn[1]].join('\t')).join('\n');
  (m.tabs||[0]).forEach(a=>{t+='\n\n'+(m.tabs?m.tabName+' '+a+'\n':'')+m.rowName+' / '+m.colName+'\t'+m.cols.join('\t');m.rows.forEach((r,k)=>{t+='\n'+r+'\t'+m.scan[a][k].map(c=>Math.round(c.j*100)+'%'+(c.ex?'*':'')).join('\t');});});
  return t+'\n\n* outside the observed MIC range (extrapolation)';}
function csvQ(v){const t=String(v);return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;}

  const R=[['item','value'],['formula',f.name],['site',i.site],['crcl_ml_min',i.crcl],['weight_kg',i.weight],['mode',i.mode],['mic_meropenem',i.micM],['mic_colistin',i.micC],['mic_ampicillin',i.micA]];

      <footer>
        <details><summary>Methods, sources and limitations</summary>
          <p>Pharmacokinetics: meropenem two-compartment model of Crandon 2011 (PMID 21136037: V1 0.239 L/kg of adjusted body weight, K12 0.487, K21 0.647, K10 = 0.392 + 0.0025 x CrCl per hour; between-patient variability set from the published standard deviations, V1 55%, K12 44%, K21 57%, K10 35% assumed; free fraction 0.92, the middle of the 0.85–0.98 range used there); sulbactam two-compartment model of Jaruratanasirikul 2016 (PMID 27671056: Vc 14.56 L, Vp 9.55 L, Q 11.5 L/h, CL = exp(0.54 + 0.28 x CrCl/30) above 65 years and exp(1.57 + 0.46 x CrCl/83) at 65 years or below, between-patient variability 48–53%; protein binding about 38%); colistin Css = CBA dose / 10^(0.0048 x CrCl + 1.667) with log-normal scatter (sigma 0.415), the regression of Nation 2017 (PMID 28011614), with 33 mg CBA per million units and a free fraction of 0.49 measured in critically ill patients (ultracentrifugation; the 0.085 figure comes from 6 healthy volunteers by microdialysis, which the authors call semiquantitative because colistin may adsorb to the equipment). The dosing equation of Garonzik 2011 (PMID 21555763) is the interim version of the same work. Weight and renal variability follow a Malaysian cohort of critically ill CRAB patients (PMID 42025645).</p>
          <p>Site penetration: ELF, CSF and tissue ratios from PMIDs 25216821, 16280244, 34570645, 27776537, 27867128, 31670654, 25336163, 30126953, 40980912, 41519407, 25267660, 26645525 and 23335739. Targets: sulbactam at least 60% fT>4 µg/mL in plasma (PMID 39031073) and at least 47.5% in ELF (PMID 39712636). Colistin free fraction 2.8–14.1% (PMID 25359520); polysorbate 80 lowers polymyxin MICs 4 to 8-fold (PMIDs 23102558, 31364075).</p>
          <p>Reference data: 39 carbapenem-resistant A. baumannii isolates with measured combination MICs for each pair and for the triple combination. Ampicillin/sulbactam was fixed at 8/4 µg/mL in every combination; colistin was at 0.03125 µg/mL in 38 isolates in the triple combination and in 36 in the colistin–meropenem pair, and at 0.0625 µg/mL in most isolates in the colistin–ampicillin/sulbactam pair, so colistin is left-censored; meropenem in combination had medians of 2 (triple), 16 (with colistin) and 64 µg/mL (with ampicillin/sulbactam). In prediction mode a kernel over the isolates' baseline MICs draws a neighbour: meropenem keeps the neighbour's fold reduction, colistin and ampicillin take the neighbour's measured value (colistin scaled up when its MIC is above 0.25 µg/mL). The sulbactam target is half the ampicillin concentration. Predicting the combination concentration from baseline MICs is weak (Spearman 0.64 for meropenem MIC; leave-one-out RMSE 1.68 log2 units against 1.90 without MICs), and the 10th–90th percentile interval covers 85% of isolates.</p>
          <p>Full texts read (PMIDs 21136037, 25359520, 28011614, 27671056, 21555763, 39712636, 40417688, 42268210, 39991086, 27776537, 40980912, 41810872, 34827359, 33371322, 42059802, 31849910) confirmed the model structure and targets, with these notes: the 47.5% ELF target applies to isolates resistant to both sulbactam and meropenem (n = 4 isolates); the 45 mg/L meropenem trough is a neurotoxicity-associated level (Imani 2017) cited by an adult CRRT study (PMID 39991086); the free fraction of colistin was 0.49 in 66 critically ill patients, much higher than the microdialysis range of 2.8–14.1%; Nation 2017 advises combination therapy when CrCl is 80 or above, for respiratory infections, or when the colistin MIC is 1 mg/L or above; the sulbactam study notes that Cockcroft-Gault CrCl may predict clearance poorly in patients over 65. Still unread: PMIDs 39031073, 40903201, 42025645. The meropenem model gives about 10% higher AUC and Cmax than the tables in Crandon 2011 and is a few points optimistic at high MICs with 0.5-h infusions.</p>
          <p>Limits: per-drug targets, not validated for any combination; static checkerboard concentrations; no CRRT, dialysis, paediatric or urine modelling; safety limits (meropenem trough 45 mg/L or above in 20% or fewer; colistin Css 4 mg/L or above in below 30%) are the simulator's choice. Results describe attainment of concentrations linked to in vitro synergy, not clinical efficacy.</p></details>

        <p>Research use only. Not for dosing individual patients. Version 1.0, November 2026.</p></footer></div>
    ${modal==='help'?html`<${Modal} title="Help" onClose=${()=>setModal(null)}><${HelpBody}/></${Modal}>`:null}
    ${modal==='export'&&res?html`<${Modal} title="Export results" onClose=${()=>setModal(null)}><div className="note">Select the text below and copy it into a spreadsheet (tab-separated).</div><textarea id="exp" readOnly value=${exportText(res)}></textarea><div style=${{marginTop:8,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}><button className="primary" onClick=${copy}>Copy to clipboard</button>${dl?html`<button onClick=${()=>saveFile('crab_pkpd_results.csv',resultsCsv(res))}>Download results (CSV)</button>`:null}${dl&&log.length?html`<button onClick=${()=>saveFile('crab_pkpd_run_log.csv',logCsv(log))}>Download run log (CSV)</button>`:null}<span className="note">${dlMsg}</span></div></${Modal}>`:null}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
